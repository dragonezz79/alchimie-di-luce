  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        const calendlyUrl =
          'https://calendly.com/gogeta7921/consulto-telefonico-con-i-tarocchi';

        const addCalendlyButton = () => {
          const paypalButton = document.querySelector(
            'a[href="https://paypal.me/AlchimieDiLuce/30"]'
          );

          if (!paypalButton) return false;

          const card = paypalButton.closest('article');
          if (!card || card.querySelector('.calendly-after-payment')) return true;

          const link = document.createElement('a');
          link.className = 'calendly-after-payment';
          link.href = calendlyUrl;
          link.target = '_blank';
          link.rel = 'noreferrer';
          link.textContent = 'Hai già pagato? Scegli giorno e orario';
          link.addEventListener('click', () => {
            if (typeof window.gtag === 'function') {
              window.gtag('event', 'click_calendly_tarocchi_telefono');
            }
          });

          const note = document.createElement('p');
          note.className = 'calendly-after-payment-note';
          note.textContent =
            'La prenotazione è riservata a chi ha già effettuato il pagamento di 30 €.';

          const buttonArea = paypalButton.closest('.buttons');
          if (buttonArea) {
            buttonArea.insertAdjacentElement('afterend', link);
          } else {
            paypalButton.insertAdjacentElement('afterend', link);
          }
          link.insertAdjacentElement('afterend', note);
          return true;
        };

        if (!addCalendlyButton()) {
          const observer = new MutationObserver(() => {
            if (addCalendlyButton()) observer.disconnect();
          });
          observer.observe(document.documentElement, {
            childList: true,
            subtree: true
          });
        }
      })();
    </script>

    <script>
      (() => {
        const addRitualiProduct = () => {
          const existing = document.getElementById('kit-7-rituali');
          if (existing) return true;

          const kitSection = document.getElementById('kit-digitale');
          if (!kitSection) return false;

          const section = document.createElement('section');
          section.id = 'kit-7-rituali';
          section.className = 'rituali-product-section';
          section.innerHTML = `
            <div class="rituali-product-card">
              <p class="rituali-eyebrow">Nuovo prodotto digitale · Promo lancio</p>
              <h2>Kit 7 Rituali di Protezione e Luce</h2>
              <p class="rituali-subtitle">
                Pratiche guidate, rituali e decreti completi per proteggere simbolicamente il tuo spazio energetico, ritrovare centratura e creare una pratica spirituale personale da seguire con i tuoi tempi.
              </p>

              <div class="rituali-grid" aria-label="Contenuto del Kit">
                <div class="rituali-feature">✓ 7 rituali guidati passo dopo passo</div>
                <div class="rituali-feature">✓ 7 decreti completi e approfonditi</div>
                <div class="rituali-feature">✓ Protezione, centratura e rilascio</div>
                <div class="rituali-feature">✓ Percorso pratico da utilizzare quando ne senti il bisogno</div>
              </div>

              <div class="rituali-price-row">
                <span class="rituali-old-price">12,90 €</span>
                <span class="rituali-price">9,90 €</span>
              </div>
              <p class="rituali-promo-note">Prezzo promo a tempo limitato</p>

              <span class="rituali-coming-soon" aria-label="Acquisto disponibile a breve">
                Disponibile a breve
              </span>

              <p class="rituali-small">
                Prodotto digitale. Il pulsante di acquisto verrà attivato appena il Kit sarà pubblicato su Payhip per il download automatico.
              </p>
            </div>
          `;

          kitSection.insertAdjacentElement('afterend', section);
          return true;
        };

        if (!addRitualiProduct()) {
          const observer = new MutationObserver(() => {
            if (addRitualiProduct()) observer.disconnect();
          });
          observer.observe(document.documentElement, {
            childList: true,
            subtree: true
          });
        }
      })();
    </script>
